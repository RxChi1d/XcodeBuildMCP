id: test_sim
module: mcp/tools/simulator/test_sim
names:
  mcp: test_sim
  cli: test
description: Test on iOS sim. In managed mode, executes standard supervised two-phase xcodebuild under an operation lease and requires explicit projectPath or workspacePath, scheme, simulatorId, and operation credentials. Prepared test artifacts, non-empty extraArgs, simulatorName, buildForTesting, and preferXcodebuild=false are rejected. testRunnerEnv is accepted in wire format. Phase 2 disables parallel testing and limits concurrent simulator destinations to one while preserving project and test-plan repetition settings. On normal phase 2 exit 0 or 65, metadata extraction is followed by shutdown of the specified Simulator and a unique available-catalog verification of its Shutdown state, clearing running app state without erase/delete or auto-reboot (subsequent UI automation requires boot_sim). Confirmed phase 1 compile failures do not shut down the simulator. Completed runs release upon explicit end; in-flight calls hold concurrent end in closing. Signals, rejected or unknown commands, open streams, cleanup failures, or unexpected exceptions after phase 2 starts and before verified shutdown block the lease without automatic TTL or recovery. Supervision confirms CoreSimulator Shutdown state without arbitrary host script process-tree guarantees. Output uses schema version 3, UI snapshots are invalidated upon admission, and next-step templates are suppressed. Normal MCP and native session resume remain available without an external resume script.
outputSchema:
  schema: xcodebuildmcp.output.test-result
  version: '3'
predicates:
  - hideWhenXcodeAgentMode
annotations:
  title: Test Simulator
  readOnlyHint: false
  destructiveHint: false
  openWorldHint: false
